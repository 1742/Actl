appId: local.dev.actl.electron
productName: Actl
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: out/fixtures
    to: verification-fixtures
asar: true
asarUnpack:
  - out/main/windows-shell-runner.cjs
  - out/main/chunks/**
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-win32-x64/**
extraFiles:
  - from: vendor/windows-sandbox/LICENSE
    to: licenses/deepseek-windows-sandbox.txt
npmRebuild: false
win:
  executableName: Actl
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'
publish: null
